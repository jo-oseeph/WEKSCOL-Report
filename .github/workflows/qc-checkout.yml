name: QC Checkout

on:
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: fertilizer-qc-checkout
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4          # private repo: scripts, requirements, parquets
        with:
          repository: adrianjuliusaluoch/wekscol-reports
          token: ${{ secrets.DATA_REPO_PAT }}
          path: data-repo

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: data-repo/requirements.txt

      - name: Install SQL Server ODBC driver
        timeout-minutes: 5
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python deps
        run: pip install -r data-repo/requirements.txt

      - name: Run extraction
        uses: nick-fields/retry@v3
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        with:
          timeout_minutes: 5
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on: any
          command: python data-repo/fert_qc.py

      - name: Commit parquets to the private repo
        working-directory: data-repo
        run: |
          git config user.name "adrianjuliusaluoch"
          git config user.email "adrianjuliusaluoch@gmail.com"
          git add data/*.parquet
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "refresh fertilizer QC report"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "attempt $i failed, retrying"
            sleep $((RANDOM % 10 + 5))
          done
          echo "push failed after 6 attempts"
          exit 1

      - name: Open issue on failure
        if: ${{ failure() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.ISSUE_PAT }}
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "Report parquet refresh failed - Run #${{ github.run_number }}" \
            --body "## Report parquet refresh failed

          The report parquet refresh workflow failed after the retry attempt.

          **Workflow:** ${{ github.workflow }}
          **Run:** #${{ github.run_number }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}

          [View failed workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          Please investigate the failed step and rerun the workflow after fixing the issue."
