name: Refresh report parquet

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * 1-6"

permissions:
  contents: write   # the default GITHUB_TOKEN is read-only unless this is set, which is why the push 403'd

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports/parquet-etl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SQL Server ODBC driver
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Run extraction
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USERNAME: ${{ secrets.SQL_USERNAME }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: python extract_to_parquet.py

      - name: Commit updated parquet
        run: |
          git config user.name "adrianjuliusaluoch"
          git config user.email "adrianjuliusaluoch@gmail.com"
          git add data/report_base.parquet
          git diff --cached --quiet || git commit -m "refresh report data"
          git push
